<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportes · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="mc-card mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-3"><label class="form-label" for="r-desde">Desde</label><input type="date" class="form-control" id="r-desde"></div>
            <div class="col-md-3"><label class="form-label" for="r-hasta">Hasta</label><input type="date" class="form-control" id="r-hasta"></div>
            <div class="col-md-3"><button class="btn btn-mc-primary w-100" id="btn-generar"><i class="bi bi-graph-up"></i> Generar reporte</button></div>
            <div class="col-md-3"><button class="btn btn-mc-secundario w-100" id="btn-exportar"><i class="bi bi-download"></i> Exportar CSV</button></div>
        </div>
    </div>

    <div class="row g-3 mb-3" id="indicadores"></div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="mc-card h-100">
                <div class="mc-card-title">Citas por día</div>
                <canvas id="grafica-dias" height="200"></canvas>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="mc-card h-100">
                <div class="mc-card-title">Distribución por especialidad</div>
                <canvas id="grafica-especialidades" height="200"></canvas>
            </div>
        </div>
        <div class="col-12">
            <div class="mc-card">
                <div class="mc-card-title">Citas por médico</div>
                <div class="table-responsive">
                    <table class="mc-tabla">
                        <thead><tr><th>Médico</th><th>Citas</th><th>Participación</th></tr></thead>
                        <tbody id="tabla-medicos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/reportes.js"></script>
</body>
</html>
