<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis citas · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="row g-3 mb-3">
        <div class="col-md-8">
            <div class="mc-card h-100">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div class="mc-card-title mb-0">Mis próximas citas</div>
                    <button class="btn btn-mc-primary" id="btn-nueva"><i class="bi bi-calendar-plus"></i> Agendar cita</button>
                </div>
                <div id="lista-proximas" class="d-grid gap-3"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="mc-card h-100">
                <div class="mc-card-title">Mis datos</div>
                <div id="datos-paciente" class="d-grid gap-2"></div>
                <hr>
                <div class="mc-card-title">Recordatorios recibidos</div>
                <div id="lista-notificaciones" class="d-grid gap-2" style="max-height:260px;overflow-y:auto"></div>
            </div>
        </div>
    </div>

    <div class="mc-card">
        <div class="mc-card-title">Historial completo</div>
        <div class="table-responsive">
            <table class="mc-tabla">
                <thead><tr><th>Código</th><th>Fecha</th><th>Médico</th><th>Especialidad</th><th>Estado</th></tr></thead>
                <tbody id="tabla-historial"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modal-cita" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-cita-titulo">Agendar cita</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="c-especialidad">Especialidad</label><select class="form-select" id="c-especialidad"></select></div>
              <div class="col-md-6"><label class="form-label" for="c-medico">Médico</label><select class="form-select" id="c-medico"></select></div>
              <div class="col-md-6"><label class="form-label" for="c-fecha">Fecha</label><input type="date" class="form-control" id="c-fecha"></div>
              <div class="col-md-6"><label class="form-label" for="c-motivo">Motivo</label><input class="form-control" id="c-motivo" placeholder="Consulta general"></div>
              <div class="col-12">
                <label class="form-label">Horarios disponibles</label>
                <div id="c-slots" class="d-flex flex-wrap gap-2"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-cita">Confirmar cita</button>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/mis-citas.js"></script>
</body>
</html>
