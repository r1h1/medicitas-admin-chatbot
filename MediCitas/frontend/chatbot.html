<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatbot WhatsApp · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="mc-card h-100">
                <div class="mc-card-title">Simulador de conversación</div>
                <p class="mc-texto-muted">Escriba como si fuera el paciente. Los mensajes pasan por el mismo flujo que usa WhatsApp.</p>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input class="form-control" id="sim-telefono" placeholder="50212345678" value="50255550000">
                    <button class="btn btn-mc-secundario" id="btn-reiniciar" title="Reiniciar conversación"><i class="bi bi-arrow-counterclockwise"></i></button>
                </div>

                <div class="mc-chat mb-3" id="chat"></div>

                <div class="input-group">
                    <input class="form-control" id="sim-texto" placeholder="Escriba un mensaje y presione Enviar">
                    <button class="btn btn-mc-primary" id="btn-enviar"><i class="bi bi-send"></i></button>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3" id="atajos"></div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="mc-card mb-3">
                <div class="mc-card-title">Conversaciones registradas</div>
                <div class="table-responsive">
                    <table class="mc-tabla">
                        <thead><tr><th>Teléfono</th><th>Paciente</th><th>Estado del flujo</th><th>Última actividad</th><th>Mensajes</th><th></th></tr></thead>
                        <tbody id="tabla-conversaciones"></tbody>
                    </table>
                </div>
            </div>

            <div class="mc-card">
                <div class="mc-card-title">Notificaciones enviadas</div>
                <div class="table-responsive">
                    <table class="mc-tabla">
                        <thead><tr><th>Paciente</th><th>Tipo</th><th>Mensaje</th><th>Programada</th><th>Estado</th></tr></thead>
                        <tbody id="tabla-notificaciones"></tbody>
                    </table>
                </div>
                <button class="btn btn-mc-secundario mt-3" id="btn-procesar"><i class="bi bi-send-check"></i> Enviar pendientes ahora</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-conversacion" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Historial de la conversación</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mc-chat" id="chat-historial"></div>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/chatbot.js"></script>
</body>
</html>
