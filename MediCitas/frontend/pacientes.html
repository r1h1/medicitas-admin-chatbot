<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacientes · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="mc-card mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label" for="f-busqueda">Buscar paciente</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input class="form-control" id="f-busqueda" placeholder="Nombre, apellido o teléfono">
                </div>
            </div>
            <div class="col-md-3">
                <button class="btn btn-mc-secundario w-100" id="btn-buscar">Buscar</button>
            </div>
            <div class="col-md-3">
                <button class="btn btn-mc-primary w-100" id="btn-nuevo"><i class="bi bi-person-plus"></i> Registrar paciente</button>
            </div>
        </div>
    </div>

    <div class="mc-card">
        <div class="table-responsive">
            <table class="mc-tabla">
                <thead>
                <tr><th>Paciente</th><th>WhatsApp</th><th>Correo</th><th>Documento</th><th>Citas</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla-pacientes"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modal-paciente" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-paciente-titulo">Registrar paciente</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="p-nombres">Nombres</label><input class="form-control" id="p-nombres"></div>
              <div class="col-md-6"><label class="form-label" for="p-apellidos">Apellidos</label><input class="form-control" id="p-apellidos"></div>
              <div class="col-md-6"><label class="form-label" for="p-telefono">Teléfono / WhatsApp</label><input class="form-control" id="p-telefono" placeholder="502 1234 5678"></div>
              <div class="col-md-6"><label class="form-label" for="p-email">Correo</label><input type="email" class="form-control" id="p-email"></div>
              <div class="col-md-4"><label class="form-label" for="p-documento">Documento</label><input class="form-control" id="p-documento"></div>
              <div class="col-md-4"><label class="form-label" for="p-nacimiento">Fecha de nacimiento</label><input type="date" class="form-control" id="p-nacimiento"></div>
              <div class="col-md-4">
                <label class="form-label" for="p-genero">Género</label>
                <select class="form-select" id="p-genero">
                    <option value="">Sin especificar</option><option value="F">Femenino</option>
                    <option value="M">Masculino</option><option value="O">Otro</option>
                </select>
              </div>
              <div class="col-12"><label class="form-label" for="p-direccion">Dirección</label><input class="form-control" id="p-direccion"></div>
              <div class="col-12 form-check ms-2">
                <input class="form-check-input" type="checkbox" id="p-activo" checked>
                <label class="form-check-label" for="p-activo">Paciente activo</label>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-paciente">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-historial" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Historial de citas</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="table-responsive">
                <table class="mc-tabla">
                    <thead><tr><th>Código</th><th>Fecha</th><th>Médico</th><th>Especialidad</th><th>Estado</th></tr></thead>
                    <tbody id="tabla-historial"></tbody>
                </table>
            </div>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/pacientes.js"></script>
</body>
</html>
