<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horarios y bloqueos · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="mc-card">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div>
                        <div class="mc-card-title mb-1">Horario laboral</div>
                        <p class="mc-texto-muted mb-0">Define los días y horas en que cada médico atiende.</p>
                    </div>
                    <button class="btn btn-mc-primary" id="btn-nuevo-horario"><i class="bi bi-plus-lg"></i> Agregar franja</button>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="f-medico">Filtrar por médico</label>
                    <select class="form-select" id="f-medico"><option value="">Todos</option></select>
                </div>

                <div class="table-responsive">
                    <table class="mc-tabla">
                        <thead><tr><th>Médico</th><th>Día</th><th>Desde</th><th>Hasta</th><th>Estado</th><th>Acciones</th></tr></thead>
                        <tbody id="tabla-horarios"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="mc-card">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div>
                        <div class="mc-card-title mb-1">Bloqueos de agenda</div>
                        <p class="mc-texto-muted mb-0">Vacaciones, feriados y cierres puntuales.</p>
                    </div>
                    <button class="btn btn-mc-primary" id="btn-nuevo-bloqueo"><i class="bi bi-calendar-x"></i> Bloquear</button>
                </div>

                <div class="table-responsive">
                    <table class="mc-tabla">
                        <thead><tr><th>Alcance</th><th>Periodo</th><th>Tipo</th><th>Motivo</th><th></th></tr></thead>
                        <tbody id="tabla-bloqueos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-horario" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-horario-titulo">Agregar franja horaria</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3"><label class="form-label" for="h-medico">Médico</label><select class="form-select" id="h-medico"></select></div>
            <div class="mb-3">
              <label class="form-label" for="h-dia">Día de la semana</label>
              <select class="form-select" id="h-dia">
                <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
                <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option>
                <option value="0">Domingo</option>
              </select>
            </div>
            <div class="row g-2">
              <div class="col-6"><label class="form-label" for="h-inicio">Desde</label><input type="time" class="form-control" id="h-inicio" value="08:00"></div>
              <div class="col-6"><label class="form-label" for="h-fin">Hasta</label><input type="time" class="form-control" id="h-fin" value="12:00"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-horario">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modal-bloqueo" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Bloquear fechas</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="b-medico">Alcance</label>
              <select class="form-select" id="b-medico"><option value="">Toda la clínica</option></select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6"><label class="form-label" for="b-inicio">Desde</label><input type="date" class="form-control" id="b-inicio"></div>
              <div class="col-6"><label class="form-label" for="b-fin">Hasta</label><input type="date" class="form-control" id="b-fin"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="b-tipo">Tipo</label>
              <select class="form-select" id="b-tipo">
                <option value="Vacaciones">Vacaciones</option>
                <option value="Feriado">Día festivo</option>
                <option value="Personal">Bloqueo personal</option>
                <option value="Mantenimiento">Mantenimiento</option>
              </select>
            </div>
            <div><label class="form-label" for="b-motivo">Motivo</label><input class="form-control" id="b-motivo"></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-bloqueo">Guardar</button>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/horarios.js"></script>
</body>
</html>
