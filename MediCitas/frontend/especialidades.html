<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Especialidades · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="mc-card mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <div class="mc-card-title mb-1">Catálogo de especialidades</div>
            <p class="mc-texto-muted mb-0">Las especialidades activas con médicos asignados son las que ofrece el chatbot.</p>
        </div>
        <button class="btn btn-mc-primary" id="btn-nueva"><i class="bi bi-plus-lg"></i> Nueva especialidad</button>
    </div>

    <div class="mc-card">
        <div class="table-responsive">
            <table class="mc-tabla">
                <thead><tr><th>Especialidad</th><th>Descripción</th><th>Médicos activos</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tabla-especialidades"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modal-especialidad" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-especialidad-titulo">Nueva especialidad</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3"><label class="form-label" for="e-nombre">Nombre</label><input class="form-control" id="e-nombre"></div>
            <div class="mb-3"><label class="form-label" for="e-descripcion">Descripción</label><textarea class="form-control" id="e-descripcion" rows="3"></textarea></div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="e-activo" checked>
              <label class="form-check-label" for="e-activo">Especialidad activa</label>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-especialidad">Guardar</button>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/especialidades.js"></script>
</body>
</html>
