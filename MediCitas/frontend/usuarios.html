<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="mc-card mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <div class="mc-card-title mb-1">Cuentas de acceso</div>
            <p class="mc-texto-muted mb-0">Administrador, recepcionista y médico acceden al panel. El paciente interactúa solo por WhatsApp.</p>
        </div>
        <button class="btn btn-mc-primary" id="btn-nuevo"><i class="bi bi-person-plus"></i> Nuevo usuario</button>
    </div>

    <div class="mc-card">
        <div class="table-responsive">
            <table class="mc-tabla">
                <thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Último acceso</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tabla-usuarios"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modal-usuario" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-usuario-titulo">Nuevo usuario</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="u-nombres">Nombres</label><input class="form-control" id="u-nombres"></div>
              <div class="col-md-6"><label class="form-label" for="u-apellidos">Apellidos</label><input class="form-control" id="u-apellidos"></div>
              <div class="col-md-6"><label class="form-label" for="u-email">Correo</label><input type="email" class="form-control" id="u-email"></div>
              <div class="col-md-6"><label class="form-label" for="u-telefono">Teléfono</label><input class="form-control" id="u-telefono"></div>
              <div class="col-md-6" id="campo-password">
                <label class="form-label" for="u-password">Contraseña</label>
                <input type="password" class="form-control" id="u-password" placeholder="Mínimo 8 caracteres">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="u-rol">Rol</label>
                <select class="form-select" id="u-rol"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="u-medico">Vincular a médico (opcional)</label>
                <select class="form-select" id="u-medico"><option value="">Sin vincular</option></select>
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="u-activo" checked>
                  <label class="form-check-label" for="u-activo">Cuenta activa</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-usuario">Guardar</button>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/usuarios.js"></script>
</body>
</html>
