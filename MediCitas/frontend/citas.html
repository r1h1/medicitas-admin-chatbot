<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Citas · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="mc-card mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label class="form-label" for="f-desde">Desde</label>
                <input type="date" class="form-control" id="f-desde">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="f-hasta">Hasta</label>
                <input type="date" class="form-control" id="f-hasta">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="f-medico">Médico</label>
                <select class="form-select" id="f-medico"><option value="">Todos</option></select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="f-estado">Estado</label>
                <select class="form-select" id="f-estado">
                    <option value="">Todos</option>
                    <option value="1">Pendiente</option>
                    <option value="2">Confirmada</option>
                    <option value="3">En atención</option>
                    <option value="4">Completada</option>
                    <option value="5">Cancelada</option>
                    <option value="6">No asistió</option>
                    <option value="7">Reprogramada</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-mc-secundario flex-grow-1" id="btn-filtrar"><i class="bi bi-funnel"></i> Filtrar</button>
                <button class="btn btn-mc-primary flex-grow-1" id="btn-nueva"><i class="bi bi-plus-lg"></i> Nueva cita</button>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-9">
            <div class="mc-card">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="mc-card-title mb-0">Listado de citas</div>
                    <span class="mc-texto-muted" id="contador-citas"></span>
                </div>
                <div class="table-responsive">
                    <table class="mc-tabla">
                        <thead>
                        <tr><th>Código</th><th>Fecha y hora</th><th>Paciente</th><th>Médico</th><th>Especialidad</th><th>Canal</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-citas"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-3">
            <div class="mc-card mb-3">
                <div class="mc-card-title">Aviso de retraso</div>
                <p class="mc-texto-muted">Notifica a los pacientes en cola y les permite esperar o reprogramar.</p>
                <div class="mb-2">
                    <label class="form-label" for="retraso-medico">Médico</label>
                    <select class="form-select" id="retraso-medico"></select>
                </div>
                <div class="row g-2">
                    <div class="col-7">
                        <label class="form-label" for="retraso-fecha">Fecha</label>
                        <input type="date" class="form-control" id="retraso-fecha">
                    </div>
                    <div class="col-5">
                        <label class="form-label" for="retraso-minutos">Minutos</label>
                        <input type="number" class="form-control" id="retraso-minutos" value="20" min="5" max="480">
                    </div>
                </div>
                <div class="my-2">
                    <label class="form-label" for="retraso-motivo">Motivo</label>
                    <input class="form-control" id="retraso-motivo" placeholder="Emergencia atendida">
                </div>
                <button class="btn btn-mc-primary w-100" id="btn-retraso"><i class="bi bi-megaphone"></i> Reportar retraso</button>
            </div>

            <div class="mc-card">
                <div class="mc-card-title">Retrasos de hoy</div>
                <div id="lista-retrasos" class="d-grid gap-2"></div>
            </div>
        </div>
    </div>

    <!-- Modal de cita -->
    <div class="modal fade" id="modal-cita" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-cita-titulo">Nueva cita</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="c-paciente">Paciente</label>
                <select class="form-select" id="c-paciente"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="c-especialidad">Especialidad</label>
                <select class="form-select" id="c-especialidad"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="c-medico">Médico</label>
                <select class="form-select" id="c-medico"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="c-fecha">Fecha</label>
                <input type="date" class="form-control" id="c-fecha">
              </div>
              <div class="col-12">
                <label class="form-label">Horarios disponibles</label>
                <div id="c-slots" class="d-flex flex-wrap gap-2"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="c-tipo">Tipo de consulta</label>
                <select class="form-select" id="c-tipo">
                    <option value="Nueva">Paciente nuevo</option>
                    <option value="Seguimiento">Paciente en seguimiento</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="c-motivo">Motivo</label>
                <input class="form-control" id="c-motivo" placeholder="Consulta general">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-mc-secundario" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-mc-primary" id="btn-guardar-cita">Guardar cita</button>
          </div>
        </div>
      </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/citas.js"></script>
</body>
</html>
