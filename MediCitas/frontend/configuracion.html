<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuración · MediCitas</title>
    <link rel="icon" href="assets/img/favicon-32.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/medicitas.css" rel="stylesheet">
</head>
<body>

<div class="mc-contenido">

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="mc-card">
                <div class="mc-card-title">Parámetros del sistema</div>
                <p class="mc-texto-muted">Controlan los recordatorios, las reglas de cancelación y el horizonte de agendamiento.</p>
                <div id="lista-configuracion" class="d-grid gap-3"></div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="mc-card mb-3">
                <div class="mc-card-title">Cambiar mi contraseña</div>
                <div class="mb-2"><label class="form-label" for="pass-actual">Contraseña actual</label><input type="password" class="form-control" id="pass-actual"></div>
                <div class="mb-3"><label class="form-label" for="pass-nueva">Contraseña nueva</label><input type="password" class="form-control" id="pass-nueva" placeholder="Mínimo 8 caracteres"></div>
                <button class="btn btn-mc-primary" id="btn-password">Actualizar contraseña</button>
            </div>

            <div class="mc-card">
                <div class="mc-card-title">Historial de actividad</div>
                <div class="table-responsive" style="max-height:420px;overflow-y:auto">
                    <table class="mc-tabla">
                        <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
                        <tbody id="tabla-bitacora"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<div id="mc-toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/configuracion.js"></script>
</body>
</html>
